lockfileVersion: '9.0'

settings:
  autoInstallPeers: true

importers:

  .:
    devDependencies:
      tool-x:
        specifier: ^1.0.0
        version: 1.0.0

  packages/db:
    dependencies:
      client-lib:
        specifier: ^2.0.0
        version: 2.0.0
      framework-y:
        specifier: ^1.0.0
        version: 1.0.0
      kysely-postgres-js:
        specifier: ^3.0.0
        version: 3.0.0(postgres@3.4.9)
      postgres:
        specifier: ^3.4.9
        version: 3.4.9

  packages/web:
    dependencies:
      '@app/db':
        specifier: workspace:*
        version: link:../db

packages:

  client-lib@2.0.0:
    resolution: {integrity: sha512-a}

  framework-y@1.0.0:
    resolution: {integrity: sha512-b}

  inner-z@1.0.0:
    resolution: {integrity: sha512-c}

  kysely-postgres-js@3.0.0:
    resolution: {integrity: sha512-d}
    peerDependencies:
      postgres: '>=3'

  postgres@3.4.7:
    resolution: {integrity: sha512-e}

  postgres@3.4.9:
    resolution: {integrity: sha512-f}

  tool-x@1.0.0:
    resolution: {integrity: sha512-g}

  tool-helper@1.0.0:
    resolution: {integrity: sha512-h}

snapshots:

  client-lib@2.0.0:
    dependencies:
      postgres: 3.4.9

  framework-y@1.0.0:
    dependencies:
      inner-z: 1.0.0

  inner-z@1.0.0:
    dependencies:
      postgres: 3.4.7

  kysely-postgres-js@3.0.0(postgres@3.4.9):
    dependencies:
      postgres: 3.4.9

  postgres@3.4.7: {}

  postgres@3.4.9: {}

  tool-x@1.0.0:
    dependencies:
      tool-helper: 1.0.0

  tool-helper@1.0.0:
    dependencies:
      postgres: 3.4.7
