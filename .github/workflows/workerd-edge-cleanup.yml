name: workerd-edge-cleanup

on:
  pull_request:
    types: [closed]
    paths-ignore: ['**/*.md', 'codemod/**', '.github/workflows/codemod.yml']

permissions:
  contents: read

concurrency:
  group: workerd-edge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete the edge Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete the Preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes wrangler@4.151.1 preview delete --worker-name postgresjs-edge --name "pr-$PR_NUMBER" --skip-confirmation
