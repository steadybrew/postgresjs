name: upstream-v4

on:
  push:
    branches: [test/upstream-v4-fixed-issues]
  workflow_dispatch:

permissions:
  contents: read

env:
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql
  KEEP_GOING: '1'

jobs:
  run:
    name: Fork tests on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fork
          - target: upstream-v4.0.0
            sha: 570be764d96c8c13e6a1a262103bf60974571b67
          - target: upstream-master
            sha: c32cf5ac852f4f02150d3cc03f34621cc86a03b7
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-postgres
        with:
          version: '18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build the fork's Workers bundle
        if: matrix.target == 'fork'
        run: npm run build:cf
      - name: Swap in upstream src
        if: matrix.target != 'fork'
        run: |
          git fetch --no-tags --depth=1 https://github.com/porsager/postgres.git ${{ matrix.sha }}
          test "$(git rev-parse FETCH_HEAD)" = "${{ matrix.sha }}"
          git rm -rq src
          git checkout FETCH_HEAD -- src
          echo 'export const Stage = {}' >> src/query.js
          echo "export function vercelPool() { throw new Error('vercelPool is not in upstream') }" > src/vercel.js
          ls src
      - name: Build the upstream Workers entry
        if: matrix.target != 'fork'
        run: |
          rm -rf cf/src
          mkdir cf/src
          cp src/*.js cf/src/
          mv cf/src/index.js cf/src/postgres.js
          mv cf/src/cf.js cf/src/index.js
          sed -i "s#from './index.js'#from './postgres.js'#" cf/src/*.js
          sed -i "s#^import { connect } from 'cloudflare:sockets'#const { connect } = await globalThis.__sockets()#" cf/src/index.js
          echo 'export {}' > cf/polyfills.js
          head -3 cf/src/index.js
      - name: tests/index.js, one test per process
        run: |
          mkdir "$RUNNER_TEMP/results"
          out="$RUNNER_TEMP/results/index.jsonl"
          touch "$out"
          LIST_TESTS=1 timeout 120 node tests/index.js | grep -a '^TEST' | cut -f2- > "$RUNNER_TEMP/tests.txt" || true
          wc -l "$RUNNER_TEMP/tests.txt"
          while IFS= read -r key; do
            name=$(node -p 'JSON.parse(process.argv[1])' "$key")
            before=$(wc -l < "$out")
            psql -qtA -c "select count(pg_terminate_backend(pid)) from pg_stat_activity where datname = 'postgres_js_test' and pid <> pg_backend_pid()" > /dev/null || true
            ONLY_TEST="$name" RESULTS_FILE="$out" timeout 60 node --unhandled-rejections=warn tests/index.js > "$RUNNER_TEMP/last.log" 2>&1 && code=0 || code=$?
            if [ "$(wc -l < "$out")" = "$before" ]; then
              node -e 'console.log(JSON.stringify({ name: JSON.parse(process.argv[1]), passed: false, error: "no result, exit " + process.argv[2] + ": " + require("fs").readFileSync(process.argv[3], "utf8").slice(-300) }))' "$key" "$code" "$RUNNER_TEMP/last.log" >> "$out"
            fi
          done < "$RUNNER_TEMP/tests.txt"
      - name: Scenario suites
        run: |
          timeout 300 node tests-startup/run.js --integration > "$RUNNER_TEMP/integration.txt" 2>&1 && code=0 || code=$?
          node -e 'console.log(JSON.stringify({ name: "integration", passed: process.argv[1] === "0", error: require("fs").readFileSync(process.argv[2], "utf8").slice(0, 1500) }))' "$code" "$RUNNER_TEMP/integration.txt" > "$RUNNER_TEMP/results/integration.log"
          cat "$RUNNER_TEMP/integration.txt" | cut -c1-3000
          for mode in reports ownership regressions; do
            timeout 2400 node tests-startup/run.js --$mode > "$RUNNER_TEMP/results/$mode.log" 2>&1 || echo "--$mode exited $?"
          done
      - name: Summary
        if: always()
        run: node tests-startup/compare-summary.mjs "$RUNNER_TEMP/results" ${{ matrix.target }}
