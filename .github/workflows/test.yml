name: test

on:
  pull_request:

env:
  NODE_OPTIONS: --unhandled-rejections=strict
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql

jobs:
  proven:
    name: Proven rows on ${{ matrix.src }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        src: [fork, upstream]
        node: ['24', '26']
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-postgres
        with:
          version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/bootstrap.js
      - name: Put the upstream 3.4.9 sources in place
        if: matrix.src == 'upstream'
        run: |
          for f in $(git ls-tree --name-only 411429e src/); do git show 411429e:$f > $f; done
          git status --short
      - name: Proven rows, one test at a time
        run: node .github/upstream-proven.mjs | tee proven.jsonl
      - name: Reporter scripts for the rows whose test fails indirectly
        if: always()
        run: |
          for p in 729 1082 1234 1087 1097 1130; do timeout 60 node .github/probe.mjs $p 2>&1 | head -30 || true; done

  workerd:
    name: workerd on ${{ matrix.src }}
    strategy:
      fail-fast: false
      matrix:
        src: [fork, upstream]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_VERSION: '17'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ env.POSTGRES_VERSION }}
      - name: Put the upstream 3.4.9 sources in place
        if: matrix.src == 'upstream'
        run: |
          for f in $(git ls-tree --name-only 411429e src/); do git show 411429e:$f > $f; done
          git status --short
      - run: npm run build:cf
      - run: bash .github/actions/setup-postgres/cluster.sh "$POSTGRES_VERSION" workerd 55432
      - run: npm run test:workerd -- . 55432 | tee workerd.jsonl
        continue-on-error: true
      - name: Worker logs
        if: always()
        run: |
          for f in /tmp/postgresjs-workerd-*/*.log; do echo "#### $f"; grep -E "setTimeout|Uncaught|WORKER_UNHANDLED|Error" "$f" | head -5 | cut -c1-300; done
