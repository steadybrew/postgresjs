name: test

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'codemod/**', '.github/workflows/codemod.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'codemod/**', '.github/workflows/codemod.yml']

permissions:
  contents: read

env:
  NODE_OPTIONS: --unhandled-rejections=strict
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql

jobs:
  node:
    name: Node v${{ matrix.node }} on PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        postgres: ['15', '16', '17', '18']
        exclude: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[]' || '[{"node":"22","postgres":"16"},{"node":"22","postgres":"17"},{"node":"26","postgres":"15"},{"node":"26","postgres":"16"},{"node":"26","postgres":"17"}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ matrix.postgres }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm run build
          npm run test:startup
          node tests-startup/run.js --cjs
          npm run test:esm
          npm run test:cjs

  deno:
    name: Deno 1.46.3 on PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-postgres
        with:
          version: '18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d
        with:
          deno-version: v1.46.3
      - run: npm run test:deno

  cloudflare:
    name: Cloudflare workerd (${{ matrix.compat_date }}${{ matrix.flags && format(' {0}', matrix.flags) || '' }}) on PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compat_date: '2025-01-01'
            close_rejections: logged
          - compat_date: '2025-09-15'
            close_rejections: logged
          - compat_date: '2025-01-01'
            flags: unhandled_rejection_after_microtask_checkpoint
          - compat_date: '2026-10-12'
    env:
      POSTGRES_VERSION: '18'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ env.POSTGRES_VERSION }}
      - run: npm run build:cf
      - name: Start workerd PostgreSQL clusters
        run: |
          openssl req -new -x509 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.crt"
          bash .github/actions/setup-postgres/cluster.sh "$POSTGRES_VERSION" workerd 55432
          bash .github/actions/setup-postgres/cluster.sh "$POSTGRES_VERSION" workerd_tls 55433 "$RUNNER_TEMP/server.crt" "$RUNNER_TEMP/server.key"
      - run: npm run test:workerd -- . 55432
        env:
          WORKERD_COMPAT_DATE: ${{ matrix.compat_date }}
          WORKERD_COMPAT_FLAGS: ${{ matrix.flags }}
          WORKERD_KNOWN_FAILURES: ${{ matrix.known_failures }}
          WORKERD_CLOSE_REJECTIONS: ${{ matrix.close_rejections }}
          WORKERD_TLS_PORT: 55433
          WORKERD_TLS_CA: ${{ runner.temp }}/server.crt

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-save eslint@8.57.1
      - run: npm run lint
      - run: npm install --no-save typescript@5.6 @types/node@22
      - run: npx tsc -p tests-types

  publish:
    name: Stage on npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, deno, cloudflare, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Check docs/changes-since-3.4.9.diff is current
        run: |
          git fetch --no-tags --depth=1 origin tag v3.4.9
          npm run -s diff:upstream
          git diff --exit-code docs/changes-since-3.4.9.diff
      - run: npm install --no-save eslint@8.57.1
      - run: npm stage publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Move next once the staged version is approved
        if: ${{ !contains(github.ref_name, '-') }}
        timeout-minutes: 30
        run: |
          until npm view "@steadybrew/postgresjs@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; do sleep 20; done
          npm dist-tag add "@steadybrew/postgresjs@${GITHUB_REF_NAME#v}" next
