name: test

on:
  pull_request:

env:
  NODE_OPTIONS: --unhandled-rejections=strict
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql

jobs:
  check:
    name: 4.5.0 tests on ${{ matrix.src }} sources
    strategy:
      fail-fast: false
      matrix:
        src: [branch, upstream]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-postgres
        with:
          version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/bootstrap.js
      - name: Put main's sources in place
        if: matrix.src == 'main'
        run: |
          git fetch -q origin main
          for f in $(git ls-tree --name-only origin/main src/); do git show origin/main:$f > $f; done
          git status --short
      - name: Put the upstream 3.4.9 sources in place
        if: matrix.src == 'upstream'
        run: |
          for f in $(git ls-tree --name-only 411429e src/); do git show 411429e:$f > $f; done
          git status --short
      - name: New tests, one at a time
        run: node .github/check.mjs | tee check.jsonl
