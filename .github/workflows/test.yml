name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  NODE_OPTIONS: --unhandled-rejections=strict
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql

jobs:
  node:
    name: Node v${{ matrix.node }} on PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        postgres: ['15', '16', '17', '18']
        exclude: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[]' || '[{"node":"22","postgres":"16"},{"node":"22","postgres":"17"},{"node":"26","postgres":"15"},{"node":"26","postgres":"16"},{"node":"26","postgres":"17"}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ matrix.postgres }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm run build
          npm run test:startup
          node tests-startup/run.js --cjs
          npm run test:esm
          npm run test:cjs

  deno:
    name: Deno 1.46.3 on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-postgres
        with:
          version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - run: npm run test:deno

  cloudflare:
    name: Cloudflare workerd on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_VERSION: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ env.POSTGRES_VERSION }}
      - run: npm run build:cf
      - name: Start workerd PostgreSQL clusters
        run: |
          openssl req -new -x509 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.crt"
          bash .github/actions/setup-postgres/cluster.sh "$POSTGRES_VERSION" workerd 55432
          bash .github/actions/setup-postgres/cluster.sh "$POSTGRES_VERSION" workerd_tls 55433 "$RUNNER_TEMP/server.crt" "$RUNNER_TEMP/server.key"
      - run: npm run test:workerd -- . 55432
        env:
          WORKERD_TLS_PORT: 55433
          WORKERD_TLS_CA: ${{ runner.temp }}/server.crt

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save eslint@8.57.1
      - run: npm run lint

  upstream:
    name: Report reproductions on upstream 3.4.9, Node ${{ matrix.node }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-postgres
        with:
          version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/bootstrap.js
      - name: Put the upstream 3.4.9 sources in place
        run: |
          for f in $(git ls-tree --name-only 411429e src/); do git show 411429e:$f > $f; done
          git status --short
      - name: Reports
        run: node tests-startup/run.js --reports | tee reports.jsonl || true
      - name: Reports that pass on upstream
        run: node .github/upstream-check.mjs reports.jsonl
      - name: Lease cases
        if: always()
        run: node tests-startup/run.js --leases | tee leases.jsonl || true
      - name: Lease cases that pass on upstream
        if: always()
        run: node .github/upstream-check.mjs leases.jsonl begin-queued-one begin-queued-one-reset begin-inflight-end begin-inflight-end-reset
      - name: Queued query at end
        if: always()
        run: node .github/upstream-case.mjs phase:end-queued-cold | tee phase.jsonl
      - name: Queued query at end passes on upstream
        if: always()
        run: node .github/upstream-check.mjs phase.jsonl phase:end-queued-cold
      - name: Single tests in tests/index.js
        if: always()
        run: |
          status=0
          cp tests/index.js "$RUNNER_TEMP/index.js"
          check() {
            cp "$RUNNER_TEMP/index.js" tests/index.js
            sed -i "s/^t('$1/ot('$1/" tests/index.js
            node tests/index.js 2>&1 | tee single.log || true
            if grep -q '✅' single.log; then echo "PASSED ON UPSTREAM: $1"; status=1
            elif ! grep -q "$2" single.log; then echo "FAILS FOR ANOTHER REASON: $1 (expected $2)"; status=1; fi
          }
          check 'arrays are sent and read back' 'malformed array literal'
          check 'end with a timeout runs a query queued while the pool is still connecting' 'failed'
          exit $status

  publish:
    name: Stage on npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, deno, cloudflare, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install --no-save eslint@8.57.1
      - run: npm stage publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Move next once the staged version is approved
        if: ${{ !contains(github.ref_name, '-') }}
        timeout-minutes: 30
        run: |
          until npm view "@steadybrew/postgresjs@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; do sleep 20; done
          npm dist-tag add "@steadybrew/postgresjs@${GITHUB_REF_NAME#v}" next
