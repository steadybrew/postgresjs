name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  NODE_OPTIONS: --unhandled-rejections=strict
  PGUSER: postgres
  PGSOCKET: /var/run/postgresql

jobs:
  node:
    name: Node v${{ matrix.node }} on PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        postgres: ['15', '16', '17', '18']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ matrix.postgres }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm run build
          npm run test:startup
          node tests-startup/run.js --cjs
          npm run test:esm
          npm run test:cjs

  deno:
    name: Deno 1.46.3 on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-postgres
        with:
          version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - run: npm run test:deno

  cloudflare:
    name: Cloudflare workerd on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build:cf
      - name: Start TLS PostgreSQL
        run: |
          openssl req -new -x509 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.crt"
          chmod 644 "$RUNNER_TEMP"/server.key "$RUNNER_TEMP"/server.crt
          docker run -d --name pgtls -p 127.0.0.1:55433:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -v "$RUNNER_TEMP:/certs:ro" --entrypoint sh public.ecr.aws/docker/library/postgres:17 -c \
            'cp /certs/server.* /var/lib/postgresql/ && chown postgres:postgres /var/lib/postgresql/server.* && chmod 600 /var/lib/postgresql/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key'
          until docker exec pgtls pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
      - run: npm run test:workerd -- . 55432
        env:
          WORKERD_TLS_PORT: 55433
          WORKERD_TLS_CA: ${{ runner.temp }}/server.crt
