name: workerd-ab

on:
  workflow_dispatch:
    inputs:
      ab_rounds:
        description: Rounds per build
        default: '150'
      ab_target:
        description: Database and fetch_types
        type: choice
        options: [supabase-false, supabase-true, neon-false]
        default: supabase-false
      ab_base:
        description: Ref whose cloudflare:sockets build this branch is compared against
        default: main
      ab_subscribe:
        description: Channels the head build subscribes to with no-op handlers; the base build never does
        type: choice
        options: [none, query, all]
        default: none

permissions:
  contents: read

concurrency:
  group: workerd-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ab:
    name: Workers CPU A/B against ${{ inputs.ab_base }} on ${{ inputs.ab_target }} (subscribers: ${{ inputs.ab_subscribe }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npx --yes wrangler@4.151.1 whoami
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ab_base }}
          path: ab-base
      - run: npm run build:cf
      - run: npm run build:cf
        working-directory: ab-base
      - run: node tests-startup/workerd-edge.mjs prepare "$RUNNER_TEMP/edge" 2026-10-12 "" ab-base
        env:
          AB_SUBSCRIBE: ${{ inputs.ab_subscribe }}
      - name: Deploy the Preview and measure
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          AB_ROUNDS: ${{ inputs.ab_rounds }}
          AB_TARGET: ${{ inputs.ab_target }}
          AB_BASE: ${{ inputs.ab_base }}
        run: |
          [ -n "$SUPABASE_DATABASE_URL" ] || { echo "The SUPABASE_DATABASE_URL secret is not set"; exit 1; }
          name="ab-$(echo "$GITHUB_REF_NAME" | tr 'A-Z._/' 'a-z---')"
          echo "PREVIEW_NAME=$name" >> "$GITHUB_ENV"
          EDGE_TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$EDGE_TOKEN"
          export EDGE_TOKEN
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ DATABASE_URL: process.env.NEON_DATABASE_URL, SUPABASE_URL: process.env.SUPABASE_DATABASE_URL, EDGE_TOKEN: process.env.EDGE_TOKEN }), { mode: 0o600 })' "$RUNNER_TEMP/secrets.json"
          (cd "$RUNNER_TEMP/edge" && npx --yes wrangler@4.151.1 preview --name "$name" --secrets-file "$RUNNER_TEMP/secrets.json" --json > "$RUNNER_TEMP/preview.json")
          rm "$RUNNER_TEMP/secrets.json"
          url=$(node tests-startup/workerd-edge.mjs url "$RUNNER_TEMP/preview.json")
          [ -n "$url" ] || { cat "$RUNNER_TEMP/preview.json"; exit 1; }
          echo "Preview $name: $url"
          node tests-startup/workerd-edge.mjs ab "$url" "$AB_ROUNDS" "$AB_TARGET" "$AB_BASE"
      - name: Delete the Preview
        if: always() && env.PREVIEW_NAME
        run: npx --yes wrangler@4.151.1 preview delete --worker-name postgresjs-edge --name "$PREVIEW_NAME" --skip-confirmation
