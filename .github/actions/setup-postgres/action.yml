name: Set up test PostgreSQL
description: Configure the primary CI cluster on 5432 and a plain secondary cluster on 5433.
inputs:
  version:
    description: PostgreSQL major version
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CI_POSTGRES_VERSION: ${{ inputs.version }}
      run: bash .github/actions/setup-postgres/setup.sh
